name: Update profile assets

# 每天重新拉一次公开数据并重绘 README 里的自绘 SVG。
# 这样「数据与轨迹」永远是最新的，且不依赖任何第三方图床。
on:
  schedule:
    - cron: "23 4 * * *" # 每天 04:23 UTC（北京时间 12:23）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/update-assets.yml"

permissions:
  contents: write

concurrency:
  group: update-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只依赖标准库，无需 pip install
      - name: Fetch public data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_data.py

      - name: Rebuild SVG assets
        run: python tools/make_assets.py

      # README 也是生成的：新增仓库会被自动带进主页，不用手改
      - name: Rebuild README
        run: python tools/make_readme.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data assets README.md; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets README.md
          git commit -m "chore: 刷新主页素材"
          git push
